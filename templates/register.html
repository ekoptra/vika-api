<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - Vika API</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        background: linear-gradient(135deg, #0FAF65 0%, #059669 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 450px;
        width: 100%;
        padding: 3rem;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        text-align: center;
        margin-bottom: 2rem;
      }

      .logo h1 {
        font-size: 2.5rem;
        background: linear-gradient(135deg, #0FAF65 0%, #059669 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .logo p {
        color: #666;
        font-size: 1rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        padding: 0.9rem 1.2rem;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s;
        font-family: inherit;
      }

      input:focus {
        outline: none;
        border-color: #0FAF65;
        box-shadow: 0 0 0 3px rgba(15, 175, 101, 0.1);
      }

      input:disabled {
        background: #f5f5f5;
        cursor: not-allowed;
      }

      .btn {
        width: 100%;
        padding: 1rem;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 1rem;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0FAF65 0%, #059669 100%);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(15, 175, 101, 0.4);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .divider {
        text-align: center;
        margin: 1.5rem 0;
        color: #999;
        position: relative;
      }

      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 45%;
        height: 1px;
        background: #e0e0e0;
      }

      .divider::before {
        left: 0;
      }

      .divider::after {
        right: 0;
      }

      .login-link {
        text-align: center;
        margin-top: 1.5rem;
        color: #666;
        font-size: 0.95rem;
      }

      .login-link a {
        color: #0FAF65;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
      }

      .login-link a:hover {
        color: #059669;
        text-decoration: underline;
      }

      .alert {
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        display: none;
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .alert.show {
        display: block;
        animation: slideDown 0.3s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .password-requirements {
        font-size: 0.85rem;
        color: #666;
        margin-top: 0.5rem;
        padding-left: 0.5rem;
      }

      .password-requirements ul {
        margin-top: 0.3rem;
        padding-left: 1.2rem;
      }

      .password-requirements li {
        margin-bottom: 0.2rem;
      }

      .back-home {
        text-align: center;
        margin-top: 1.5rem;
      }

      .back-home a {
        color: #0FAF65;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s;
      }

      .back-home a:hover {
        color: #059669;
      }

      @media (max-width: 768px) {
        .container {
          padding: 2rem;
        }

        .logo h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>Vika API</h1>
        <p>Buat akun baru Anda</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input
            type="text"
            id="nama"
            name="nama"
            placeholder="Masukkan nama lengkap"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimal 8 karakter"
            required
          />
          <div class="password-requirements">
            <ul>
              <li>Minimal 8 karakter</li>
              <li>Kombinasi huruf dan angka disarankan</li>
            </ul>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Masukkan password kembali"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          Daftar Sekarang
        </button>
      </form>

      <div class="login-link">
        Sudah punya akun? <a href="/login">Login di sini</a>
      </div>

      <div class="back-home">
        <a href="/">← Kembali ke Beranda</a>
      </div>
    </div>

    <script>
      const registerForm = document.getElementById("registerForm");
      const alertBox = document.getElementById("alertBox");
      const submitBtn = document.getElementById("submitBtn");

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type} show`;

        setTimeout(() => {
          alertBox.classList.remove("show");
        }, 5000);
      }

      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        // Validation
        if (password.length < 8) {
          showAlert("Password minimal 8 karakter", "error");
          return;
        }

        if (password !== confirmPassword) {
          showAlert("Password dan konfirmasi password tidak cocok", "error");
          return;
        }

        // Disable button
        submitBtn.disabled = true;
        submitBtn.textContent = "Mendaftar...";

        try {
          const response = await fetch("/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              nama,
              email,
              password,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showAlert(
              "Pendaftaran berhasil! API Key Anda: " + data.api_key,
              "success"
            );

            // Redirect to API keys page after 2 seconds
            setTimeout(() => {
              window.location.href = "/api-keys?key=" + data.api_key;
            }, 2000);
          } else {
            showAlert(data.detail || "Terjadi kesalahan saat mendaftar", "error");
          }
        } catch (error) {
          showAlert("Gagal terhubung ke server. Coba lagi nanti.", "error");
          console.error("Error:", error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Daftar Sekarang";
        }
      });
    </script>
  </body>
</html>
