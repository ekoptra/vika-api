<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Test - Vika API</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        width: 100%;
        padding: 30px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .connection-section {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
        font-weight: 500;
      }

      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #dc3545;
        animation: pulse 2s infinite;
      }

      .status-dot.connected {
        background: #28a745;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #333;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 10px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-right: 10px;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
        transform: translateY(-1px);
      }

      .btn-danger {
        background: #dc3545;
        color: white;
      }

      .btn-danger:hover {
        background: #c82333;
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: #6c757d;
        color: white;
      }

      .btn-secondary:hover {
        background: #5a6268;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      .events-section {
        margin-top: 20px;
      }

      .events-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      h2 {
        color: #333;
        font-size: 20px;
      }

      .events-list {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        max-height: 400px;
        overflow-y: auto;
      }

      .event-item {
        background: white;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 10px;
        border-left: 4px solid #667eea;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .event-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .event-name {
        font-weight: 600;
        color: #667eea;
        font-size: 14px;
      }

      .event-time {
        font-size: 12px;
        color: #999;
      }

      .event-data {
        background: #f1f3f5;
        padding: 10px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        color: #333;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #999;
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }

      .test-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔌 Socket.IO Test</h1>
      <p class="subtitle">Test real-time connection to Vika API</p>

      <div class="connection-section">
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Disconnected</span>
        </div>

        <div class="form-group">
          <label>Session ID (from /auth/initialize)</label>
          <input type="text" id="sessionIdInput" value="" />
        </div>

        <div class="form-group">
          <label>Socket.IO URL</label>
          <input
            type="text"
            id="socketUrlInput"
            placeholder="http://localhost:8000"
            value="http://localhost:8000"
          />
        </div>

        <div>
          <button class="btn btn-primary" id="connectBtn" onclick="connect()">
            Connect
          </button>
          <button
            class="btn btn-danger"
            id="disconnectBtn"
            onclick="disconnect()"
            disabled
          >
            Disconnect
          </button>
        </div>

        <div class="test-actions">
          <button
            class="btn btn-secondary"
            onclick="sendPing()"
            id="pingBtn"
            disabled
          >
            Send Ping
          </button>
        </div>
      </div>

      <div class="events-section">
        <div class="events-header">
          <h2>📨 Events Log</h2>
          <button class="btn btn-secondary" onclick="clearEvents()">
            Clear
          </button>
        </div>

        <div class="events-list" id="eventsList">
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>No events yet. Connect to start receiving events.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      let socket = null;
      const eventsList = document.getElementById("eventsList");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const connectBtn = document.getElementById("connectBtn");
      const disconnectBtn = document.getElementById("disconnectBtn");
      const pingBtn = document.getElementById("pingBtn");

      function updateStatus(connected) {
        if (connected) {
          statusDot.classList.add("connected");
          statusText.textContent = "Connected";
          connectBtn.disabled = true;
          disconnectBtn.disabled = false;
          pingBtn.disabled = false;
        } else {
          statusDot.classList.remove("connected");
          statusText.textContent = "Disconnected";
          connectBtn.disabled = false;
          disconnectBtn.disabled = true;
          pingBtn.disabled = true;
        }
      }

      function addEvent(eventName, data) {
        // Remove empty state
        const emptyState = eventsList.querySelector(".empty-state");
        if (emptyState) {
          emptyState.remove();
        }

        const eventItem = document.createElement("div");
        eventItem.className = "event-item";

        const now = new Date();
        const timeStr = now.toLocaleTimeString();

        eventItem.innerHTML = `
        <div class="event-header">
          <span class="event-name">${eventName}</span>
          <span class="event-time">${timeStr}</span>
        </div>
        <div class="event-data">${JSON.stringify(data, null, 2)}</div>
      `;

        eventsList.insertBefore(eventItem, eventsList.firstChild);

        // Keep only last 50 events
        const events = eventsList.querySelectorAll(".event-item");
        if (events.length > 50) {
          events[events.length - 1].remove();
        }
      }

      function connect() {
        const sessionId = document
          .getElementById("sessionIdInput")
          .value.trim();
        const socketUrl = document
          .getElementById("socketUrlInput")
          .value.trim();

        if (!sessionId) {
          alert("Please enter a session ID");
          return;
        }

        if (socket) {
          socket.disconnect();
        }

        // Connect to Socket.IO with authentication
        // Using default path /socket.io
        socket = io(socketUrl, {
          auth: {
            session_id: sessionId,
          },
          transports: ["websocket", "polling"],
        });

        // Connection events
        socket.on("connect", () => {
          console.log("Connected to Socket.IO");
          updateStatus(true);
          addEvent("connect", { socket_id: socket.id });
        });

        socket.on("disconnect", (reason) => {
          console.log("Disconnected from Socket.IO:", reason);
          updateStatus(false);
          addEvent("disconnect", { reason });
        });

        socket.on("connect_error", (error) => {
          console.error("Connection error:", error);
          updateStatus(false);
          addEvent("connect_error", {
            message: error.message,
            description:
              "Failed to connect. Check session_id and server status.",
          });
        });

        // Custom events from server
        socket.on("connected", (data) => {
          console.log("Received connected event:", data);
          addEvent("connected", data);
        });

        socket.on("conversation_processed", (data) => {
          console.log("Conversation processed:", data);
          addEvent("conversation_processed", data);
        });

        socket.on("pong", (data) => {
          console.log("Received pong:", data);
          addEvent("pong", data);
        });

        // Catch all other events
        socket.onAny((eventName, ...args) => {
          if (
            ![
              "connect",
              "disconnect",
              "connect_error",
              "connected",
              "conversation_processed",
              "pong",
            ].includes(eventName)
          ) {
            console.log("Received event:", eventName, args);
            addEvent(eventName, args);
          }
        });
      }

      function disconnect() {
        if (socket) {
          socket.disconnect();
          socket = null;
        }
      }

      function sendPing() {
        if (socket && socket.connected) {
          socket.emit("ping", { timestamp: new Date().toISOString() });
          addEvent("ping (sent)", { timestamp: new Date().toISOString() });
        }
      }

      function clearEvents() {
        eventsList.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>No events yet. Connect to start receiving events.</p>
        </div>
      `;
      }
    </script>
  </body>
</html>
