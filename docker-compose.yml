services:
  app:
    build: .
    container_name: vika-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
    command: "poetry run uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  uploads_data:
